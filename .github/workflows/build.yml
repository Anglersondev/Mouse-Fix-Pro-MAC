name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Versão do Swift
        run: swift --version
      - name: Compilar o app (Apple Silicon + Intel)
        run: UNIVERSAL=1 ./scripts/build-app.sh
      - name: Compactar
        run: cd build && ditto -c -k --keepParent "Mouse Fix Pro.app" MouseFixPro.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MouseFixPro
          path: build/MouseFixPro.zip
      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/MouseFixPro.zip \
            --title "Mouse Fix Pro ${GITHUB_REF_NAME#v}" --generate-notes
