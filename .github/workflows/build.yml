name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar release com a versão do Info.plist"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Versão do Swift
        run: swift --version
      - name: Compilar o app (Apple Silicon + Intel)
        run: UNIVERSAL=1 ./scripts/build-app.sh
      - name: Compactar
        run: cd build && ditto -c -k --keepParent "Mouse Fix Pro.app" MouseFixPro.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MouseFixPro
          path: build/MouseFixPro.zip
      - name: Publicar release (tag v* ou execução manual com release)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          fi
          gh release create "$TAG" build/MouseFixPro.zip --target "$GITHUB_SHA" \
            --title "Mouse Fix Pro ${TAG#v}" --generate-notes
