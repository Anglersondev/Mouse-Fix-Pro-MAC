name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Versão do Swift
        run: swift --version
      - name: Compilar o app (Apple Silicon + Intel)
        run: UNIVERSAL=1 ./scripts/build-app.sh
      - name: Compactar
        run: cd build && ditto -c -k --keepParent "Mouse Fix Pro.app" MouseFixPro.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MouseFixPro
          path: build/MouseFixPro.zip
