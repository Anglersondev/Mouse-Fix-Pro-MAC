name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar release com a versão do Info.plist"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Compilar e verificar no macOS 27
        run: |
          sw_vers
          swift --version
          ./scripts/build-app.sh
          codesign --verify --deep --strict "build/Mouse Fix Pro.app"

  build:
    runs-on: macos-26
    outputs:
      version: ${{ steps.app-version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Versão do Swift
        run: |
          sw_vers
          swift --version
      - name: Compilar o app (Apple Silicon + Intel)
        run: UNIVERSAL=1 ./scripts/build-app.sh
      - name: Verificar o bundle
        id: app-version
        run: |
          APP="build/Mouse Fix Pro.app"
          HELPER="$APP/Contents/Library/LoginItems/Mouse Fix Pro Helper.app"
          codesign --verify --deep --strict "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")
          HELPER_VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$HELPER/Contents/Info.plist")
          [[ "$VERSION" == "$HELPER_VERSION" ]]
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Compactar
        run: cd build && ditto -c -k --keepParent "Mouse Fix Pro.app" MouseFixPro.zip
      - uses: actions/upload-artifact@v6
        with:
          name: MouseFixPro
          path: build/MouseFixPro.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: [build, compatibility]
    concurrency:
      group: release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: MouseFixPro
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v$APP_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME difere da versão $TAG do bundle."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "::error::A release $TAG pertence a outro commit."
              exit 1
            fi
            HAS_ASSET=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq 'any(.assets[]; .name == "MouseFixPro.zip" and .size > 0)')
            if [[ "$HAS_ASSET" == "true" ]]; then
              echo "A release $TAG já contém MouseFixPro.zip."
              exit 0
            fi
            gh release upload "$TAG" MouseFixPro.zip --repo "$GITHUB_REPOSITORY"
          else
            # Se a tag já existir sem release, só publique o build correspondente a ela.
            if TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2>/dev/null); then
              if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
                echo "::error::A tag $TAG pertence a outro commit."
                exit 1
              fi
            fi
            gh release create "$TAG" MouseFixPro.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Mouse Fix Pro $APP_VERSION" --generate-notes
          fi
