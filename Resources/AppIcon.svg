<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6E8BFF"/>
      <stop offset="0.55" stop-color="#5145E6"/>
      <stop offset="1" stop-color="#2E1A8C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE1F2"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3EE6C8"/>
      <stop offset="1" stop-color="#18A0FB"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#120A4A" flood-opacity="0.45"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- trilhas de movimento -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" opacity="0.28">
      <path d="M262 380 Q300 330 340 318" stroke-width="22"/>
      <path d="M232 470 Q262 420 300 400" stroke-width="18" opacity="0.7"/>
      <path d="M762 644 Q724 694 684 706" stroke-width="22"/>
      <path d="M792 554 Q762 604 724 624" stroke-width="18" opacity="0.7"/>
    </g>
  </g>

  <!-- mouse -->
  <g filter="url(#shadow)" transform="rotate(-12 512 520)">
    <rect x="352" y="250" width="320" height="520" rx="160" fill="url(#body)"/>
  </g>
  <g transform="rotate(-12 512 520)">
    <!-- divisão dos botões -->
    <path d="M512 252 L512 430" stroke="#B9C0DA" stroke-width="8" stroke-linecap="round"/>
    <path d="M356 440 Q512 470 668 440" fill="none" stroke="#C9CFE4" stroke-width="7" stroke-linecap="round"/>
    <!-- rodinha -->
    <rect x="490" y="318" width="44" height="96" rx="22" fill="url(#wheel)"/>
    <rect x="501" y="334" width="22" height="20" rx="8" fill="#FFFFFF" opacity="0.55"/>
    <!-- botões laterais -->
    <rect x="336" y="470" width="26" height="62" rx="13" fill="#3EE6C8"/>
    <rect x="336" y="548" width="26" height="62" rx="13" fill="#18A0FB"/>
    <!-- brilho -->
    <path d="M400 330 Q410 280 470 262" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
